[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankguard-ai"
version = "0.1.0"
description = "BankGuard AI — Production-Grade Agentic Banking Operations Platform"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-community>=0.3.0",
    "litellm>=1.50.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Cache / working memory
    "redis>=5.0.0",
    "valkey>=6.0.0",

    # Retry / circuit breaker / harness
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",

    # Embeddings / RAG
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",

    # AWS
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # Observability
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "langfuse>=2.50.0",
    "prometheus-client>=0.21.0",

    # PII detection
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",

    # Operations UI
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
eval = [
    "deepeval>=1.4.0",
    "ragas>=0.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipython>=8.27.0",
]

[tool.setuptools.packages.find]
# Flat-layout: tell setuptools exactly which top-level packages to include.
# Without this, setuptools refuses to build because it finds multiple
# top-level directories and cannot determine intent.
include = [
    "agents*",
    "apps*",
    "approvals*",
    "context*",
    "evals*",
    "guardrails*",
    "harness*",
    "memory*",
    "observability*",
    "synthetic_data*",
    "tools*",
    "workflows*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N818",   # Exception names — BudgetExceeded, SandboxViolation are established names
]
per-file-ignores = { "apps/operations-ui/app.py" = ["E501"] }  # Streamlit UI strings are naturally long

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
