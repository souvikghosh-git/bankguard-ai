version: "3.9"

# BankGuard AI — Local development infrastructure only.
# Runs the data + observability services on loopback so the host
# Python processes (uvicorn, streamlit) can reach them at localhost.
#
# Usage:
#   docker-compose -f docker-compose.local.yml up -d
#   uvicorn apps.api.main:app --reload --port 8000
#   streamlit run apps/operations-ui/app.py
#
# All ports bind to 127.0.0.1 — not reachable from other machines on
# the same network (safe for coffee-shop / shared Wi-Fi development).

networks:
  bankguard-local:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  grafana_data:
  loki_data:

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankguard
      POSTGRES_USER: bankguard
      POSTGRES_PASSWORD: bankguard_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - bankguard-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    container_name: bankguard-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - bankguard-local
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Langfuse — LLM trace UI; accessible at http://localhost:3000
  langfuse:
    image: langfuse/langfuse:2
    container_name: bankguard-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bankguard:bankguard_dev_password@postgres:5432/bankguard
      # Langfuse v2 requires >= 32-char secrets
      NEXTAUTH_SECRET: "local-dev-nextauth-secret-32-chars!!"
      SALT: "local-dev-salt-value-must-be-32chars"
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bankguard-local
    depends_on:
      postgres:
        condition: service_healthy

  # Prometheus — metrics scrape
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bankguard-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - bankguard-local

  # Grafana — dashboards at http://localhost:3002  (admin/admin)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bankguard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - bankguard-local

  # OPA — tool authorization policy at http://localhost:8181
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: bankguard-opa
    restart: unless-stopped
    volumes:
      - ./guardrails/policy_engine/rego:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - bankguard-local

  # Temporal OSS — durable HITL workflows at http://localhost:8088 (UI)
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: bankguard-temporal
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=bankguard
      - POSTGRES_PWD=bankguard_dev_password
      - POSTGRES_SEEDS=postgres
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - bankguard-local
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: bankguard-temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - bankguard-local
    depends_on:
      - temporal
