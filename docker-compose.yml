version: "3.9"

# BankGuard AI — Full stack via Docker Compose
# Target: EC2 t4g.xlarge (4 vCPU / 16 GB) in ap-south-1
# All services share one bridge network: bankguard-net

networks:
  bankguard-net:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  langfuse_data:
  prometheus_data:
  grafana_data:
  loki_data:
  temporal_data:
  otel_data:

services:

  # ----------------------------------------------------------------
  # PostgreSQL + pgvector
  # Stores: cases, transactions, agent memory, embeddings
  # ----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankguard}
      POSTGRES_USER: ${POSTGRES_USER:-bankguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankguard_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - bankguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # ----------------------------------------------------------------
  # Valkey (Redis-compatible OSS cache)
  # Stores: working memory, session state, rate-limit counters
  # ----------------------------------------------------------------
  valkey:
    image: valkey/valkey:7-alpine
    container_name: bankguard-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    networks:
      - bankguard-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------
  # Temporal OSS (durable workflows + HITL)
  # ----------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: bankguard-temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-bankguard}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-bankguard_dev_password}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    networks:
      - bankguard-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-ui:
    image: temporalio/ui:2.31
    container_name: bankguard-temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3001
    ports:
      - "8088:8080"
    networks:
      - bankguard-net
    depends_on:
      - temporal

  # ----------------------------------------------------------------
  # Langfuse OSS (LLM/agent observability)
  # ----------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: bankguard-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankguard}:${POSTGRES_PASSWORD:-bankguard_dev_password}@postgres:5432/${POSTGRES_DB:-bankguard}
      NEXTAUTH_SECRET: ${APP_SECRET_KEY:-change-me-secret-32chars-minimum!}
      SALT: ${APP_SECRET_KEY:-change-me-salt-32chars-minimum!!}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_SECRET: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      LANGFUSE_PUBLIC: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      - "3000:3000"
    networks:
      - bankguard-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------------------
  # OpenTelemetry Collector
  # ----------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: bankguard-otel
    restart: unless-stopped
    volumes:
      - ./infrastructure/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics scrape
    networks:
      - bankguard-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bankguard-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - bankguard-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bankguard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${APP_SECRET_KEY:-bankguard_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - bankguard-net
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # Loki (log aggregation)
  # ----------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.0
    container_name: bankguard-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - bankguard-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # OPA (Open Policy Agent — authorization)
  # ----------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: bankguard-opa
    restart: unless-stopped
    volumes:
      - ./guardrails/policy_engine/rego:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    ports:
      - "8181:8181"
    networks:
      - bankguard-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bankguard-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379/0
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OPA_URL: http://opa:8181
      TEMPORAL_HOST: temporal:7233
    ports:
      - "8000:8000"
    networks:
      - bankguard-net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          memory: 3G

  # ----------------------------------------------------------------
  # Caddy (reverse proxy + TLS)
  # ----------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: bankguard-caddy
    restart: unless-stopped
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - bankguard-net
    depends_on:
      - api
