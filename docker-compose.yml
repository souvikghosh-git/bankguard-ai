version: "3.9"

# BankGuard AI — Full production stack via Docker Compose
# Target: EC2 t4g.xlarge (4 vCPU / 16 GB) in ap-south-1
#
# SECURITY MODEL:
#   - Two networks:
#       bankguard-internal  →  service-to-service only, NOT routable from host
#       bankguard-edge      →  only Caddy sits on this network + the host bridge
#   - ALL service ports are bound to 127.0.0.1 (loopback) on the host.
#     This means even if the EC2 Security Group is misconfigured, the processes
#     cannot be reached from outside the instance.
#   - Only Caddy exposes 80/443 to the public (via the EC2 Security Group).
#   - Temporal, OPA, Prometheus, Loki, OTLP collector, Grafana are reachable
#     ONLY via docker-internal DNS names, never from the internet.

networks:
  # Internal mesh — all backend services communicate here
  bankguard-internal:
    driver: bridge
    internal: true          # <-- blocks external routing at the docker level

  # Edge — only Caddy and API live here so Caddy can proxy to API
  bankguard-edge:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  prometheus_data:
  grafana_data:
  loki_data:
  temporal_data:

services:

  # ----------------------------------------------------------------
  # PostgreSQL + pgvector
  # ----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankguard}
      POSTGRES_USER: ${POSTGRES_USER:-bankguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Bind to loopback only — not reachable from outside the instance
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - bankguard-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # ----------------------------------------------------------------
  # Valkey (Redis-compatible OSS)
  # ----------------------------------------------------------------
  valkey:
    image: valkey/valkey:7-alpine
    container_name: bankguard-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --bind 0.0.0.0 --protected-mode no
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - bankguard-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------
  # Temporal OSS (durable HITL workflows)
  # ----------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: bankguard-temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-bankguard}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_SEEDS=postgres
    # gRPC port — internal only
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - bankguard-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-ui:
    image: temporalio/ui:2.31
    container_name: bankguard-temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - bankguard-internal
    depends_on:
      - temporal

  # ----------------------------------------------------------------
  # Langfuse OSS (LLM tracing)
  # ----------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: bankguard-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankguard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-bankguard}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set}
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bankguard-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------------------
  # OpenTelemetry Collector
  # ----------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: bankguard-otel
    restart: unless-stopped
    volumes:
      - ./infrastructure/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    command: ["--config=/etc/otel-collector.yaml"]
    # OTLP ports — internal only; API container pushes over docker DNS
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    networks:
      - bankguard-internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bankguard-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - bankguard-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bankguard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - bankguard-internal
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # Loki (log aggregation)
  # ----------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.0
    container_name: bankguard-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - bankguard-internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # OPA (Open Policy Agent — tool authorization)
  # ----------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: bankguard-opa
    restart: unless-stopped
    volumes:
      - ./guardrails/policy_engine/rego:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"         # reduce noise; use metrics for health
      - "/policies"
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - bankguard-internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bankguard-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379/0
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OPA_URL: http://opa:8181
      TEMPORAL_HOST: temporal:7233
    # API is NOT exposed directly to the internet; Caddy proxies to it
    expose:
      - "8000"
    networks:
      - bankguard-internal
      - bankguard-edge
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G

  # ----------------------------------------------------------------
  # Caddy — ONLY service with public ports
  # Terminates TLS; reverse-proxies /api, /ws, / to internal services
  # ----------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: bankguard-caddy
    restart: unless-stopped
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"     # HTTP → redirect to HTTPS
      - "443:443"   # HTTPS — the ONLY public port
    networks:
      - bankguard-edge
    depends_on:
      - api

volumes:
  postgres_data:
  valkey_data:
  prometheus_data:
  grafana_data:
  loki_data:
  temporal_data:
  caddy_data:
  caddy_config:
